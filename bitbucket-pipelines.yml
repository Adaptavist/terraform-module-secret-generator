definitions:
    scripts:
        # OIDC setup for specific AWS account
        - &oidc-dev |
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            export AWS_ACCOUNT_ID=270148732964
            export AWS_ROLE_ARN=arn:aws:iam::${AWS_ACCOUNT_ID}:role/BitBucketOIDCAccessRole_${BITBUCKET_WORKSPACE}
            export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
            echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
            export AWS_ROLE_SESSION_NAME=$BITBUCKET_REPO_SLUG
            export AWS_DEFAULT_REGION=us-east-1

    tests: &test
        name: Node Build
        image: node:24-slim
        oidc: true
        script:
            - corepack enable pnpm
            - pnpm config set "//nexus.adaptavist.net/repository/npm-group/:_auth" "$NPM_TOKEN"
            - *oidc-dev
            - cd typescript
            - pnpm install && pnpm run lint && pnpm run build
            - AWS_REGION="${AWS_DEFAULT_REGION}" pnpm run test

    go-tests: &go-test
        name: Go Tests
        image: hashicorp/terraform:1.17.2
        oidc: true
        script:
            - *oidc-dev
            - cd test && go test

    check: &check
        name: Check HCL
        image: hashicorp/terraform:1.17.2
        script:
            - (echo ${PIPELINE_GIT_PRIVATE_KEY} | base64 -d >> ~/.ssh/id_rsa) && chmod 0600 ~/.ssh/id_rsa
            - terraform fmt -check -recursive -diff

    test-plan: &test-plan
        name: TF Test Plan
        image: hashicorp/terraform:1.17.2
        oidc: true
        script:
            - *oidc-dev
            - cd test/fixture
            - terraform init -backend-config="key=modules/module-secret-generator/tests/fixures/default/test.tfstate"
            - |
               terraform plan -out=plan.out \
                    -var aws_region=us-west-2 \
                    -var "positive_test_ssm_parameter_name=/module-secret-generator/test/path1" \
                    -var "positive_test_existing_ssm_parameter_name=/module-secret-generator/test/path2" \
                    -var "positive_test_existing_replace_ssm_parameter_name=/module-secret-generator/test/path3"
            - terraform apply plan.out
            - |
               terraform destroy -auto-approve \
                    -var aws_region=us-west-2 \
                    -var "positive_test_ssm_parameter_name=/module-secret-generator/test/path1" \
                    -var "positive_test_existing_ssm_parameter_name=/module-secret-generator/test/path2" \
                    -var "positive_test_existing_replace_ssm_parameter_name=/module-secret-generator/test/path3"
        artifacts:
            - test/fixture/plan.out
            - test/fixture/plan.out.json

    transpile: &transpile
        name: Transpile TS
        image: node:24-slim
        script:
            - corepack enable pnpm
            - pnpm config set "//nexus.adaptavist.net/repository/npm-group/:_auth" "$NPM_TOKEN"
            - apt-get update && apt-get install -y git
            - cd typescript && pnpm install && pnpm run lint && pnpm run build
            - cd ..
            - git add typescript/dist/*
            - git commit --allow-empty -m '[skip ci] transpiled TS to JS'
            - git push

    release: &release
        name: Release
        image: node:24-slim
        script:
            - apt-get update && apt-get install -y git
            - corepack enable pnpm
            - pnpm config set "//nexus.adaptavist.net/repository/npm-group/:_auth" "$NPM_TOKEN"
            - pnpm install
            - pnpm exec semantic-release -r ${BITBUCKET_GIT_HTTP_ORIGIN}

pipelines:
    default:
        -   step: *check
        -   step: *test-plan
        -   step: *test
        #-   step: *go-test
        -   step: *transpile

    branches:
        master:
            -   step: *check
            -   step: *test-plan
            -   step: *test
            #-   step: *go-test
            -   step: *release
