definitions:
    scripts:
        # OIDC setup for specific AWS account
        - &oidc-dev |
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            export AWS_ACCOUNT_ID=270148732964
            export AWS_ROLE_ARN=arn:aws:iam::${AWS_ACCOUNT_ID}:role/BitBucketOIDCAccessRole_${BITBUCKET_WORKSPACE}
            export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
            echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
            export AWS_ROLE_SESSION_NAME=$BITBUCKET_REPO_SLUG
            export AWS_DEFAULT_REGION=us-east-1

    tests: &test
        name: Node Build
        image: node:22-slim
        oidc: true
        script:
            - *oidc-dev
            - cd typescript
            - npm ci && npm run-script build
            - AWS_REGION="${AWS_DEFAULT_REGION}" npm run test

    go-tests: &go-test
        name: Go Tests
        image: hashicorp/terraform
        oidc: true
        script:
            - *oidc-dev
            - cd test && go test

    check: &check
        name: Check HCL
        image: hashicorp/terraform
        script:
            - (echo ${PIPELINE_GIT_PRIVATE_KEY} | base64 -d >> ~/.ssh/id_rsa) && chmod 0600 ~/.ssh/id_rsa
            - terraform fmt -check -recursive -diff

    test-plan: &test-plan
        name: TF Test Plan
        image: eerkunt/terraform-compliance
        oidc: true
        script:
            - *oidc-dev
            - cd test/fixture
            - terraform init -backend-config="key=modules/module-secret-generator/tests/fixures/default/compliance-test.tfstate"
            - |
               terraform plan -out=plan.out \
                    -var aws_region=us-west-2 \
                    -var "positive_test_ssm_parameter_name=/some/fake/path1" \
                    -var "positive_test_existing_ssm_parameter_name=/some/fake/path2" \
                    -var "positive_test_existing_replace_ssm_parameter_name=/some/fake/path3"
            - terraform show -json plan.out > plan.out.json # https://github.com/terraform-compliance/cli/issues/632
        artifacts:
            - test/fixture/plan.out
            - test/fixture/plan.out.json

    compliance: &compliance
        name: TF Compliance
        image: eerkunt/terraform-compliance
        script:
            - cd test/fixture
            - terraform-compliance -f git:https://github.com/Adaptavist/terraform-compliance.git -p plan.out.json

    transpile: &transpile
        name: Transpile TS
        image: node:22-slim
        caches:
            - node
        script:
            - apt-get update && apt-get install -y git
            - cd typescript && npm ci && npm run-script build
            - cd ..
            - git add typescript/dist/*
            - git commit --allow-empty -m '[skip ci] transpiled TS to JS'
            - git push

    release: &release
        name: Release
        image: node:22-slim
        caches:
            - node
        script:
            - npm ci
            - npx semantic-release -r ${BITBUCKET_GIT_HTTP_ORIGIN}

pipelines:
    default:
        -   step: *check
        -   step: *test-plan
        #-   step: *compliance
        -   step: *test
        #-   step: *go-test
        -   step: *transpile

    branches:
        master:
            -   step: *check
            -   step: *test-plan
            #-   step: *compliance
            -   step: *test
            #-   step: *go-test
            -   step: *release
